/**/cam_pub:
  ros__parameters:
    use_sim_time: false
    camera_name: camera
    camera_topic: /image_raw
    camera_status_topic: /status
    device_path: /dev/video0
    image_size:
      - 640
      - 480
    publish_rate: 15

/**/object_tracker:
  ros__parameters:
    use_sim_time: false
    camera_name: camera
    camera_topic: /image_raw
    debug_topic: /tracker/debug_image
    state_topic: /tracker/object_state
    min_area: 500